<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    @font-face {
      font-family: "Outfit";
      font-weight: 600;
      src: url("fonts/Outfit-SemiBold.ttf") format("truetype");
    }
    @font-face {
      font-family: "Outfit";
      font-weight: 700;
      src: url("fonts/Outfit-Bold.ttf") format("truetype");
    }
    @font-face {
      font-family: "IBM Plex Sans";
      font-weight: 400;
      src: url("fonts/IBMPlexSans-Regular.ttf") format("truetype");
    }
    @font-face {
      font-family: "IBM Plex Sans";
      font-weight: 500;
      src: url("fonts/IBMPlexSans-Medium.ttf") format("truetype");
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #070C14;
    }
    .card {
      position: relative;
      width: 1200px;
      height: 630px;
      background: #070C14 url("og-bg.png") center / cover no-repeat;
    }
    .lockup {
      position: absolute;
      left: 50%;
      top: 338px;
      transform: translateX(-50%);
      width: 760px;
      text-align: center;
      background: linear-gradient(
        180deg,
        rgba(7, 12, 20, 0) 0%,
        rgba(7, 12, 20, 0.42) 22%,
        rgba(7, 12, 20, 0.42) 78%,
        rgba(7, 12, 20, 0) 100%
      );
      padding: 10px 0 18px;
    }
    .wordmark {
      font-family: Outfit, sans-serif;
      font-weight: 700;
      font-size: 62px;
      letter-spacing: 0.1em;
      line-height: 1;
      white-space: nowrap;
    }
    .sky {
      color: #7EB6D0;
    }
    .ryse {
      color: #E8EEF4;
    }
    .rule {
      width: 72px;
      height: 1px;
      margin: 18px auto 16px;
      background: #7EB6D0;
      opacity: 0.55;
    }
    .sub {
      font-family: "IBM Plex Sans", sans-serif;
      font-weight: 400;
      font-size: 16px;
      letter-spacing: 0.22em;
      color: #E8EEF4;
      opacity: 0.78;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="lockup">
      <div class="wordmark"><span class="sky">SKY</span><span class="ryse">RYSE</span></div>
      <div class="rule"></div>
      <div class="sub">Business Management System · QM-001</div>
    </div>
  </div>
</body>
</html>
